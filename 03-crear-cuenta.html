body{margin:0;background:#C9D3D9;display:flex;flex-direction:column;align-items:center;padding:0 0 32px;min-height:100vh;box-sizing:border-box}
a{color:#1C4F7F}a:hover{color:#031F4F}

<div style="width: 390px; height: 1040px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F7F9; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #031F4F; overflow: hidden">
  <div style="background: #031F4F; color: #FFFFFF; padding: 52px 20px 24px; display: flex; align-items: center; gap: 12px">
    <a href="01-bienvenida.html" aria-label="Volver" style="width: 52px; height: 52px; border-radius: 14px; background: #1C4F7F; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 28px; font-weight: 700">Crear mi cuenta</h1>
  </div>

  

  
    <div style="flex: 1; padding: 24px 24px 28px; display: flex; flex-direction: column; gap: 18px">
      <p style="margin: 0; font-size: 18px; line-height: 1.4">Los campos marcados con * son obligatorios.</p>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="nombre" style="font-size: 20px; font-weight: 700">Nombre completo *</label>
        <input id="nombre" type="text" autocomplete="name" value="" style="height: 60px; box-sizing: border-box; padding: 0 16px; border: 2px solid #5C6F77; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 20px; color: #031F4F">
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="correo" style="font-size: 20px; font-weight: 700">Correo electrónico *</label>
        <input id="correo" type="email" autocomplete="email" placeholder="nombre@correo.com" value="" aria-invalid="false" style="height: 60px; box-sizing: border-box; padding: 0 16px; border: 2px solid #5C6F77; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 20px; color: #031F4F">
        
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="clave" style="font-size: 20px; font-weight: 700">Contraseña *</label>
        <input id="clave" type="password" autocomplete="new-password" aria-describedby="reglas" style="height: 60px; box-sizing: border-box; padding: 0 16px; border: 2px solid #5C6F77; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 20px; color: #031F4F">
        <ul id="reglas" style="margin: 4px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px">
          
            <li style="display: flex; align-items: center; gap: 10px; font-size: 17px; color: #5C6F77; font-weight: 400">
              <span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #5C6F77; display: flex; align-items: center; justify-content: center; font-size: 14px; box-sizing: border-box"></span>
              <span>Al menos 8 caracteres</span>
            </li>
          
            <li style="display: flex; align-items: center; gap: 10px; font-size: 17px; color: #5C6F77; font-weight: 400">
              <span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #5C6F77; display: flex; align-items: center; justify-content: center; font-size: 14px; box-sizing: border-box"></span>
              <span>Al menos una letra</span>
            </li>
          
            <li style="display: flex; align-items: center; gap: 10px; font-size: 17px; color: #5C6F77; font-weight: 400">
              <span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #5C6F77; display: flex; align-items: center; justify-content: center; font-size: 14px; box-sizing: border-box"></span>
              <span>Al menos un número</span>
            </li>
          
        </ul>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="clave2" style="font-size: 20px; font-weight: 700">Repita la contraseña *</label>
        <input id="clave2" type="password" autocomplete="new-password" style="height: 60px; box-sizing: border-box; padding: 0 16px; border: 2px solid #5C6F77; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 20px; color: #031F4F">
      </div>

      <div style="display: flex; gap: 14px; align-items: flex-start; padding: 14px; border-radius: 14px; background: #FFFFFF; border: 2px solid #DCE3E6">
        <input id="acepto" type="checkbox" style="width: 30px; height: 30px; margin: 2px 0 0; accent-color: #1C4F7F; flex-shrink: 0">
        <label for="acepto" style="font-size: 17px; line-height: 1.4">Acepto el tratamiento de mis datos según la Ley 1581 de 2012. <a href="#politica" style="font-weight: 700">Leer la política</a></label>
      </div>

      <a href="03c-crear-cuenta-exito.html" style="display: flex; align-items: center; justify-content: center; box-sizing: border-box; text-decoration: none; height: 64px; border: none; border-radius: 16px; background: #F5B846; color: #031F4F; font-family: inherit; font-size: 22px; font-weight: 700; cursor: pointer; margin-top: 4px">Crear mi cuenta</a>

      <p style="margin: 0; text-align: center; font-size: 18px">¿Ya tiene cuenta? <a href="02-entrar.html" style="font-weight: 700">Entrar</a></p>
    </div>
  
</div>
